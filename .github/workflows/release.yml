name: Release
# Publishes server.json to the official MCP Registry (remote endpoint only, no packages)
# via GitHub OIDC. The npm package edgar-entity-mcp is deprecated and is no longer published.
# Each registry version must be unique: bump package.json, run `npm run gen`, then publish a
# GitHub release vX.Y.Z (or run this workflow manually).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry login via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 24.22.1 (patched)
          check-latest: true
      - name: Assert patched Node
        run: node scripts/check-node-version.mjs
      - name: Check versions match (and the tag on release)
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          echo "package.json=$PKG server.json=$SRV ref=$GITHUB_REF_NAME"
          [ "$PKG" = "$SRV" ] || { echo "::error::version mismatch: package.json $PKG vs server.json $SRV"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$PKG"; exit 1
          fi
          if node -e "process.exit(require('./server.json').packages?.length ? 0 : 1)"; then
            echo "::error::server.json must not list packages (npm is deprecated)"; exit 1
          fi
      - name: Install mcp-publisher (pinned, sha256-verified)
        env:
          # Pinned release of github.com/modelcontextprotocol/registry. To bump: take the hash for
          # mcp-publisher_linux_amd64.tar.gz from that release's registry_<version>_checksums.txt.
          MCP_PUBLISHER_VERSION: "1.8.6"
          MCP_PUBLISHER_SHA256: "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340"
        run: |
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c - \
            || { echo "::error::mcp-publisher v${MCP_PUBLISHER_VERSION} sha256 mismatch"; exit 1; }
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          rm mcp-publisher_linux_amd64.tar.gz
          ./mcp-publisher --version
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

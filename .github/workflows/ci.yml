name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Patched lines only (Node.js security release 2026-10-21; 20.x is EOL).
        # check-latest pulls the newest patch instead of a possibly stale runner cache;
        # the "Assert patched Node" step fails the job if an older patch is picked up.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Assert patched Node
        run: node scripts/check-node-version.mjs
      - run: npm ci
      - run: npm run check
  smoke:
    # Live calls to SEC + state portals; runs on main pushes only to stay polite.
    # Skips (green) when the SEC_USER_AGENT repo secret is not configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check for SEC_USER_AGENT secret
        id: ua
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "has_ua=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live smoke skipped::Set the SEC_USER_AGENT repository secret (e.g. 'Your Name you@example.com') to enable live SEC/state smoke tests."
          else
            echo "has_ua=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ua.outputs.has_ua == 'true'
      - uses: actions/setup-node@v4
        if: steps.ua.outputs.has_ua == 'true'
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
        if: steps.ua.outputs.has_ua == 'true'
      - run: npm run smoke:e2e
        if: steps.ua.outputs.has_ua == 'true'
      - name: Live check of the hosted endpoint
        run: npm run smoke:remote -- https://edgar-entity-mcp.vercel.app/mcp
        if: steps.ua.outputs.has_ua == 'true'
